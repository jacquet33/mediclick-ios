workflows:
  mediclick-ios:
    name: MediClick iOS
    max_build_duration: 30
    
    environment:
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.mediclick.app
      vars:
        XCODE_WORKSPACE: "MediClick.xcodeproj"
        XCODE_SCHEME: "MediClick"
      xcode: 16.0
      cocoapods: default
    
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: main
          include: true
    
    scripts:
      # 1. Instalar XcodeGen para generar el proyecto Xcode
      - name: Install XcodeGen
        script: |
          brew install xcodegen
      
      # 2. Generar .xcodeproj desde project.yml
      - name: Generate Xcode project
        script: |
          xcodegen generate
      
      # 3. Configurar signing
      - name: Set up code signing
        script: |
          keychain initialize
      
      # 4. Build
      - name: Build iOS
        script: |
          xcodebuild build \
            -project MediClick.xcodeproj \
            -scheme MediClick \
            -sdk iphoneos \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            CODE_SIGN_IDENTITY="iPhone Distribution" \
            DEVELOPMENT_TEAM="$DEVELOPMENT_TEAM" \
            clean build
      
      # 5. Archive
      - name: Archive
        script: |
          xcodebuild archive \
            -project MediClick.xcodeproj \
            -scheme MediClick \
            -sdk iphoneos \
            -configuration Release \
            -archivePath build/MediClick.xcarchive \
            CODE_SIGN_IDENTITY="iPhone Distribution" \
            DEVELOPMENT_TEAM="$DEVELOPMENT_TEAM"
      
      # 6. Export IPA
      - name: Export IPA
        script: |
          xcodebuild -exportArchive \
            -archivePath build/MediClick.xcarchive \
            -exportPath build/ipa \
            -exportOptionsPlist exportOptions.plist
    
    artifacts:
      - build/ipa/*.ipa
    
    publishing:
      app_store_connect:
        # Sube automáticamente a TestFlight
        auth: integration
        submit_to_testflight: true
        beta_groups:
          - MediClick Testers
