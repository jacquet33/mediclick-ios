workflows:
  mediclick-ios:
    name: MediClick iOS
    max_build_duration: 30
    instance_type: mac_mini_m2
    environment:
      groups:
        - a
      vars:
        XCODE_SCHEME: "MediClick"
        BUNDLE_ID: "com.mediclick.app"
      xcode: latest
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: main
          include: true
    scripts:
      - name: Install XcodeGen
        script: brew install xcodegen
      - name: Generate Xcode project
        script: xcodegen generate
      - name: Inject ATS exception
        script: |
          # Build once to generate Info.plist, then modify it
          # Approach: override via xcconfig
          cat > ats.xcconfig << 'XCEOF'
          GENERATE_INFOPLIST_FILE = YES
          XCEOF
          
          # Add ATS directly to the pbxproj build settings
          # Using sed to add the key after GENERATE_INFOPLIST_FILE
          PBXPROJ="MediClick.xcodeproj/project.pbxproj"
          sed -i '' 's/GENERATE_INFOPLIST_FILE = YES;/GENERATE_INFOPLIST_FILE = YES; INFOPLIST_KEY_NSAppTransportSecurity_NSAllowsArbitraryLoads = YES;/g' "$PBXPROJ"
          echo "ATS exception injected"
      - name: Set up keychain
        script: keychain initialize
      - name: Fetch signing files
        script: app-store-connect fetch-signing-files "$BUNDLE_ID" --type IOS_APP_STORE --create
      - name: Add certificates
        script: keychain add-certificates
      - name: Set up profiles
        script: xcode-project use-profiles
      - name: Build IPA
        script: xcode-project build-ipa --project MediClick.xcodeproj --scheme "$XCODE_SCHEME"
      - name: Upload to TestFlight
        script: app-store-connect publish --path build/ios/ipa/*.ipa
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
