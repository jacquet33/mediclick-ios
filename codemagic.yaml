workflows:
  mediclick-ios:
    name: MediClick iOS
    max_build_duration: 30
    instance_type: mac_mini_m2
    environment:
      groups:
        - a
      vars:
        XCODE_SCHEME: "MediClick"
        BUNDLE_ID: "com.mediclick.app"
      xcode: latest
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: main
          include: true
    scripts:
      - name: Install XcodeGen
        script: brew install xcodegen
      - name: Generate Xcode project
        script: xcodegen generate
      - name: Build for Simulator
        script: |
          xcodebuild build \
            -project MediClick.xcodeproj \
            -scheme "$XCODE_SCHEME" \
            -sdk iphonesimulator \
            -destination 'platform=iOS Simulator,name=iPhone 16,OS=latest' \
            -configuration Debug \
            CODE_SIGNING_ALLOWED=NO | xcpretty
    artifacts:
      - /tmp/xcodebuild_logs/*.log
