workflows:
  mediclick-ios:
    name: MediClick iOS
    max_build_duration: 30
    instance_type: mac_mini_m2
    environment:
      groups:
        - a
      vars:
        XCODE_SCHEME: "MediClick"
        BUNDLE_ID: "com.mediclick.app"
      xcode: latest
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: main
          include: true
    scripts:
      - name: Install XcodeGen
        script: brew install xcodegen
      - name: Generate Xcode project
        script: xcodegen generate
      - name: Set up keychain
        script: keychain initialize
      - name: Fetch signing files
        script: |
          app-store-connect fetch-signing-files "$BUNDLE_ID" \
            --type IOS_APP_STORE \
            --create
      - name: Add certificates
        script: keychain add-certificates
      - name: Set up profiles
        script: xcode-project use-profiles
      - name: Archive
        script: |
          xcodebuild -project MediClick.xcodeproj \
            -scheme "$XCODE_SCHEME" \
            -sdk iphoneos \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath build/MediClick.xcarchive \
            GENERATE_INFOPLIST_FILE=YES \
            archive | xcpretty
      - name: Export IPA
        script: |
          xcodebuild -exportArchive \
            -archivePath build/MediClick.xcarchive \
            -exportPath build/ipa \
            -exportOptionsPlist exportOptions.plist
      - name: Upload to TestFlight
        script: |
          app-store-connect publish \
            --path build/ipa/*.ipa
    artifacts:
      - build/ipa/*.ipa
      - build/MediClick.xcarchive
      - /tmp/xcodebuild_logs/*.log
