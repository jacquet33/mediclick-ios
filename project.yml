name: MediClick
options:
  bundleIdPrefix: com.mediclick
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "16.0"
  generateEmptyDirectories: true

settings:
  base:
    SWIFT_VERSION: "5.9"
    MARKETING_VERSION: "1.0.2"
    GENERATE_INFOPLIST_FILE: YES

targets:
  MediClick:
    type: application
    platform: iOS
    sources:
      - path: MediClick
        type: group
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.mediclick.app
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: "UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        INFOPLIST_KEY_CFBundleDisplayName: "MediClick"
        INFOPLIST_KEY_LSApplicationCategoryType: "public.app-category.medical"
        INFOPLIST_KEY_NSLocalNetworkUsageDescription: "MediClick necesita acceso a la red local para sincronizar"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        ASSETCATALOG_COMPILER_INCLUDE_ALL_APPICON_ASSETS: YES
        CODE_SIGN_STYLE: Manual
        ENABLE_PREVIEWS: YES
    entitlements:
      path: MediClick/MediClick.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.network.client: true
